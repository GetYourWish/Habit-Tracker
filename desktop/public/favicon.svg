<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="28" y="28" width="200" height="200" rx="56" fill="url(#bg)"/>
  <!-- Recursive spiral: each blade is the previous one scaled to 0.78 and rotated 42deg -->
  <g transform="translate(128 128)">
    <g transform="rotate(0)"><rect x="-9" y="-88" width="18" height="88" rx="9" fill="url(#blade)"/></g>
    <g transform="rotate(42) scale(0.78)"><rect x="-9" y="-88" width="18" height="88" rx="9" fill="url(#blade)"/></g>
    <g transform="rotate(84) scale(0.608)"><rect x="-9" y="-88" width="18" height="88" rx="9" fill="url(#blade)"/></g>
    <g transform="rotate(126) scale(0.475)"><rect x="-9" y="-88" width="18" height="88" rx="9" fill="url(#blade)"/></g>
    <g transform="rotate(168) scale(0.37)"><rect x="-9" y="-88" width="18" height="88" rx="9" fill="url(#blade)"/></g>
    <g transform="rotate(210) scale(0.289)"><rect x="-9" y="-88" width="18" height="88" rx="9" fill="url(#blade)"/></g>
    <g transform="rotate(252) scale(0.225)"><rect x="-9" y="-88" width="18" height="88" rx="9" fill="url(#blade)"/></g>
    <g transform="rotate(294) scale(0.176)"><rect x="-9" y="-88" width="18" height="88" rx="9" fill="url(#blade)"/></g>
    <g transform="rotate(336) scale(0.137)"><rect x="-9" y="-88" width="18" height="88" rx="9" fill="url(#blade)"/></g>
    <!-- start symbol: six-pointed spark at the pivot -->
    <g fill="#ffffff">
      <circle cx="0" cy="0" r="7" />
      <rect x="-2.5" y="-24" width="5" height="17" rx="2.5" />
      <rect x="-2.5" y="-24" width="5" height="17" rx="2.5" transform="rotate(60)" />
      <rect x="-2.5" y="-24" width="5" height="17" rx="2.5" transform="rotate(120)" />
      <rect x="-2.5" y="-24" width="5" height="17" rx="2.5" transform="rotate(180)" />
      <rect x="-2.5" y="-24" width="5" height="17" rx="2.5" transform="rotate(240)" />
      <rect x="-2.5" y="-24" width="5" height="17" rx="2.5" transform="rotate(300)" />
    </g>
  </g>
</svg>
